<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 690" width="1080" height="690" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>System architecture: device simulator, legacy link with attacker, gateway internals, AES link, control centre</title>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e6b38"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="690" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="600" fill="#111111">System architecture of the simulated migration gateway</text>
  <text x="24" y="56" font-size="13" fill="#555555">Figure C.1 — Part C, section C.5. Telemetry flows left to right. Each box is a module of the repository layout in C.5.2.</text>

  <!-- ================= Device simulator ================= -->
  <rect x="24" y="92" width="168" height="120" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="108" y="118" font-size="14" font-weight="600" text-anchor="middle" fill="#111111">Device simulator</text>
  <text x="108" y="139" font-size="11" text-anchor="middle" fill="#555555">telemetry/device_sim.py</text>
  <line x1="40" y1="150" x2="176" y2="150" stroke="#dddddd" stroke-width="1"/>
  <text x="108" y="168" font-size="11.5" text-anchor="middle" fill="#333333">builds a reading</text>
  <text x="108" y="185" font-size="11.5" text-anchor="middle" fill="#333333">encrypts with its own</text>
  <text x="108" y="201" font-size="11.5" text-anchor="middle" fill="#333333">legacy cipher and key</text>

  <!-- ================= Legacy link ================= -->
  <rect x="206" y="86" width="186" height="132" rx="8" fill="#fdf0ef" stroke="#e5b3ae" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="299" y="107" font-size="11.5" font-weight="700" text-anchor="middle" fill="#b3261e">LEGACY LINK — unprotected</text>

  <line x1="196" y1="140" x2="286" y2="140" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="312" y1="140" x2="402" y2="140" stroke="#333333" stroke-width="2" marker-end="url(#a)"/>
  <text x="299" y="130" font-size="10.5" text-anchor="middle" fill="#777777">classical cipher</text>

  <rect x="222" y="150" width="154" height="58" rx="5" fill="#ffffff" stroke="#b3261e" stroke-width="1.8"/>
  <text x="299" y="170" font-size="12.5" font-weight="700" text-anchor="middle" fill="#b3261e">MITM attacker</text>
  <text x="299" y="187" font-size="10.5" text-anchor="middle" fill="#555555">attacks/mitm_proxy.py</text>
  <text x="299" y="202" font-size="10.5" text-anchor="middle" fill="#333333">read · tamper · inject · replay</text>

  <!-- ================= Gateway ================= -->
  <rect x="416" y="86" width="268" height="380" rx="8" fill="#fff8e5" stroke="#9a7b1f" stroke-width="2.4"/>
  <text x="550" y="112" font-size="15" font-weight="700" text-anchor="middle" fill="#111111">GATEWAY</text>
  <text x="550" y="130" font-size="11" text-anchor="middle" fill="#6b5612">gateway/gateway.py</text>

  <rect x="434" y="142" width="232" height="38" rx="5" fill="#ffffff" stroke="#9a7b1f" stroke-width="1.3"/>
  <text x="446" y="159" font-size="12" font-weight="600" fill="#111111">1 · Profile lookup</text>
  <text x="446" y="174" font-size="10.5" fill="#666666">profiles.py — cipher + key per device</text>

  <line x1="550" y1="182" x2="550" y2="192" stroke="#9a7b1f" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="434" y="194" width="232" height="38" rx="5" fill="#ffffff" stroke="#9a7b1f" stroke-width="1.3"/>
  <text x="446" y="211" font-size="12" font-weight="600" fill="#111111">2 · Legacy decrypt</text>
  <text x="446" y="226" font-size="10.5" fill="#666666">ciphers/ — written from scratch</text>

  <line x1="550" y1="234" x2="550" y2="244" stroke="#9a7b1f" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="434" y="246" width="232" height="38" rx="5" fill="#ffffff" stroke="#9a7b1f" stroke-width="1.3"/>
  <text x="446" y="263" font-size="12" font-weight="600" fill="#111111">3 · Parser</text>
  <text x="446" y="278" font-size="10.5" fill="#666666">reading.py — reject malformed frames</text>

  <line x1="550" y1="286" x2="550" y2="296" stroke="#9a7b1f" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="434" y="298" width="232" height="54" rx="5" fill="#ffffff" stroke="#b3261e" stroke-width="1.8"/>
  <text x="446" y="316" font-size="12" font-weight="600" fill="#111111">4 · Validator</text>
  <text x="446" y="331" font-size="10.5" fill="#666666">validator.py — range, rate, sequence</text>
  <text x="446" y="346" font-size="10.5" font-weight="600" fill="#b3261e">switchable ON / OFF for experiments</text>

  <line x1="550" y1="354" x2="550" y2="364" stroke="#9a7b1f" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="434" y="366" width="232" height="38" rx="5" fill="#ffffff" stroke="#1e6b38" stroke-width="1.6"/>
  <text x="446" y="383" font-size="12" font-weight="600" fill="#111111">5 · AES envelope</text>
  <text x="446" y="398" font-size="10.5" fill="#666666">aes_envelope.py — AES-256-GCM seal</text>

  <line x1="550" y1="406" x2="550" y2="416" stroke="#9a7b1f" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="434" y="418" width="232" height="34" rx="5" fill="#f5f5f5" stroke="#888888" stroke-width="1.2"/>
  <text x="446" y="434" font-size="12" font-weight="600" fill="#111111">6 · Logger</text>
  <text x="446" y="447" font-size="10.5" fill="#666666">every decision recorded with a reason</text>

  <!-- ================= AES link ================= -->
  <rect x="698" y="86" width="358" height="150" rx="8" fill="#eef6f0" stroke="#9cc3a8" stroke-width="1.5"/>
  <text x="712" y="106" font-size="11.5" font-weight="700" fill="#1e6b38">AES LINK — protected</text>

  <!-- direct data path, attacker is NOT in it -->
  <line x1="688" y1="140" x2="942" y2="140" stroke="#1e6b38" stroke-width="2" marker-end="url(#ga)"/>
  <text x="800" y="132" font-size="10.5" text-anchor="middle" fill="#777777">authenticated envelope</text>

  <rect x="946" y="112" width="100" height="74" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="996" y="134" font-size="13" font-weight="600" text-anchor="middle" fill="#111111">Control</text>
  <text x="996" y="150" font-size="13" font-weight="600" text-anchor="middle" fill="#111111">centre</text>
  <text x="996" y="168" font-size="10" text-anchor="middle" fill="#555555">centre.py</text>

  <!-- passive attacker taps the link, off the data path -->
  <line x1="812" y1="142" x2="812" y2="172" stroke="#1e6b38" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="820" y="162" font-size="10.5" fill="#1e6b38">taps</text>

  <rect x="734" y="174" width="158" height="50" rx="5" fill="#ffffff" stroke="#1e6b38" stroke-width="1.5"/>
  <text x="813" y="194" font-size="12" font-weight="600" text-anchor="middle" fill="#111111">Passive attacker</text>
  <text x="813" y="211" font-size="10.5" text-anchor="middle" fill="#333333">listens and replays only</text>

  <!-- control centre checks -->
  <rect x="756" y="252" width="290" height="104" rx="6" fill="#ffffff" stroke="#1e6b38" stroke-width="1.6"/>
  <text x="770" y="274" font-size="12.5" font-weight="700" fill="#1e6b38">Control centre checks</text>
  <text x="770" y="294" font-size="11.5" fill="#333333">· GCM tag over header and payload</text>
  <text x="770" y="312" font-size="11.5" fill="#333333">· gateway sequence number must increase</text>
  <text x="770" y="330" font-size="11.5" fill="#333333">· timestamp within a 30 s window</text>
  <text x="770" y="348" font-size="11.5" fill="#333333">· reject on any failure, with a reason</text>
  <line x1="996" y1="190" x2="972" y2="248" stroke="#1e6b38" stroke-width="1.5" marker-end="url(#ga)"/>

  <!-- ================= Key finding ================= -->
  <rect x="24" y="252" width="368" height="110" rx="6" fill="#fdf0ef" stroke="#b3261e" stroke-width="1.6"/>
  <text x="38" y="274" font-size="12.5" font-weight="700" fill="#b3261e">What the architecture cannot fix (V2)</text>
  <text x="38" y="295" font-size="11.5" fill="#333333">The gateway re-encrypts whatever it receives. A frame</text>
  <text x="38" y="312" font-size="11.5" fill="#333333">forged on the legacy link is sealed into a valid envelope</text>
  <text x="38" y="329" font-size="11.5" fill="#333333">and believed at the centre. The validator narrows this,</text>
  <text x="38" y="346" font-size="11.5" fill="#333333">but an in-range edit still passes.</text>

  <!-- ================= Frame ================= -->
  <rect x="24" y="382" width="368" height="110" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.3"/>
  <text x="38" y="404" font-size="12.5" font-weight="700" fill="#111111">Telemetry frame, 27 characters</text>
  <text x="38" y="428" font-size="13" font-family="Consolas, monospace" fill="#111111">D07V2301I0152F4998B1Q000123</text>
  <text x="38" y="450" font-size="11" fill="#555555">D device · V voltage · I current · F frequency</text>
  <text x="38" y="467" font-size="11" fill="#555555">B breaker · Q sequence. Alphabet A–Z 0–9, mod 36.</text>
  <text x="38" y="484" font-size="11" fill="#555555">Full field widths in the table of C.5.3.</text>

  <!-- ================= Envelope ================= -->
  <rect x="416" y="496" width="630" height="106" rx="6" fill="#eef6f0" stroke="#9cc3a8" stroke-width="1.4"/>
  <text x="430" y="518" font-size="12.5" font-weight="700" fill="#1e6b38">AES envelope — 74 bytes carrying a 27-byte frame (47 bytes overhead, measured)</text>
  <text x="430" y="542" font-size="11.5" fill="#333333">version 1 B · gateway_id 2 B · gateway_seq 8 B · timestamp 8 B   →  authenticated as associated data</text>
  <text x="430" y="562" font-size="11.5" fill="#333333">nonce 12 B, fresh and random per message</text>
  <text x="430" y="582" font-size="11.5" fill="#333333">ciphertext + GCM tag. Key from file or environment, never in source. Field table in C.5.5.</text>

  <text x="24" y="632" font-size="11" fill="#777777">Dashed red: unprotected. Solid green: protected. The gateway straddles both, which is why it is the component under study.</text>
  <text x="24" y="652" font-size="11" fill="#777777">Validation is switchable so that experiments can compare the same attack with checks off and on (C.6).</text>
</svg>
