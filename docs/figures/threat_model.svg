<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Threat model: four attacker positions around a legacy cipher migration gateway</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3261e"/>
    </marker>
    <marker id="greenarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e6b38"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="600" fill="#111111">Threat model: attacker positions in a partly migrated link</text>
  <text x="24" y="56" font-size="13" fill="#555555">Figure A.1 — Positions P1 to P4 of Part A, section A.4.1. The gateway creates two trust boundaries where there was one.</text>

  <!-- Unprotected zone -->
  <rect x="24" y="86" width="430" height="150" rx="8" fill="#fdf0ef" stroke="#e5b3ae" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="40" y="108" font-size="11.5" font-weight="600" fill="#b3261e">UNPROTECTED ZONE — no confidentiality, integrity or authentication</text>

  <!-- Protected zone -->
  <rect x="556" y="86" width="400" height="150" rx="8" fill="#eef6f0" stroke="#9cc3a8" stroke-width="1.5"/>
  <text x="572" y="108" font-size="11.5" font-weight="600" fill="#1e6b38">PROTECTED ZONE — AES-256-GCM, sequence number, timestamp</text>

  <!-- Legacy device -->
  <rect x="44" y="126" width="150" height="86" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="119" y="156" font-size="14" font-weight="600" text-anchor="middle" fill="#111111">Legacy device</text>
  <text x="119" y="176" font-size="11.5" text-anchor="middle" fill="#555555">RTU / PLC / IED / meter</text>
  <text x="119" y="194" font-size="11.5" text-anchor="middle" fill="#555555">cannot run AES</text>

  <!-- Gateway -->
  <rect x="430" y="118" width="150" height="102" rx="6" fill="#fff8e5" stroke="#9a7b1f" stroke-width="2.4"/>
  <text x="505" y="146" font-size="14" font-weight="600" text-anchor="middle" fill="#111111">GATEWAY</text>
  <text x="505" y="166" font-size="11.5" text-anchor="middle" fill="#6b5612">decrypt legacy</text>
  <text x="505" y="183" font-size="11.5" text-anchor="middle" fill="#6b5612">validate</text>
  <text x="505" y="200" font-size="11.5" text-anchor="middle" fill="#6b5612">re-encrypt AES</text>

  <!-- Control centre -->
  <rect x="790" y="126" width="150" height="86" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="865" y="156" font-size="14" font-weight="600" text-anchor="middle" fill="#111111">Control centre</text>
  <text x="865" y="176" font-size="11.5" text-anchor="middle" fill="#555555">verify tag, seq, time</text>
  <text x="865" y="194" font-size="11.5" text-anchor="middle" fill="#555555">display reading</text>

  <!-- Links -->
  <line x1="196" y1="169" x2="426" y2="169" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="311" y="160" font-size="12" font-weight="600" text-anchor="middle" fill="#b3261e">legacy link</text>
  <text x="311" y="186" font-size="11" text-anchor="middle" fill="#555555">plaintext or classical cipher</text>

  <line x1="582" y1="169" x2="786" y2="169" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="684" y="160" font-size="12" font-weight="600" text-anchor="middle" fill="#1e6b38">AES link</text>
  <text x="684" y="186" font-size="11" text-anchor="middle" fill="#555555">authenticated envelope</text>

  <!-- Trust boundary marker -->
  <line x1="505" y1="86" x2="505" y2="118" stroke="#9a7b1f" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>
  <line x1="505" y1="220" x2="505" y2="236" stroke="#9a7b1f" stroke-width="1" stroke-dasharray="3 3" opacity="0.55"/>

  <!-- Attacker positions -->
  <!-- P1 -->
  <rect x="196" y="282" width="226" height="104" rx="6" fill="#fdf0ef" stroke="#b3261e" stroke-width="1.8"/>
  <text x="210" y="304" font-size="13" font-weight="700" fill="#b3261e">P1 — Legacy link</text>
  <text x="210" y="324" font-size="11.5" fill="#333333">Read, alter, inject, replay frames</text>
  <text x="210" y="342" font-size="11.5" fill="#333333">Lost: confidentiality, integrity,</text>
  <text x="210" y="358" font-size="11.5" fill="#333333">source authentication</text>
  <text x="210" y="378" font-size="11.5" font-weight="600" fill="#b3261e">V1, V2, V6</text>
  <line x1="309" y1="278" x2="309" y2="198" stroke="#b3261e" stroke-width="1.8" marker-end="url(#redarrow)"/>

  <!-- P2 -->
  <rect x="440" y="282" width="226" height="104" rx="6" fill="#fdf0ef" stroke="#b3261e" stroke-width="1.8"/>
  <text x="454" y="304" font-size="13" font-weight="700" fill="#b3261e">P2 — Inside the gateway</text>
  <text x="454" y="324" font-size="11.5" fill="#333333">Sees plaintext between decrypt</text>
  <text x="454" y="340" font-size="11.5" fill="#333333">and re-encrypt; may read keys</text>
  <text x="454" y="358" font-size="11.5" fill="#333333">Lost: all, for every device behind</text>
  <text x="454" y="378" font-size="11.5" font-weight="600" fill="#b3261e">V3, V4</text>
  <line x1="553" y1="278" x2="540" y2="224" stroke="#b3261e" stroke-width="1.8" marker-end="url(#redarrow)"/>

  <!-- P3 -->
  <rect x="684" y="282" width="226" height="104" rx="6" fill="#eef6f0" stroke="#1e6b38" stroke-width="1.8"/>
  <text x="698" y="304" font-size="13" font-weight="700" fill="#1e6b38">P3 — AES link</text>
  <text x="698" y="324" font-size="11.5" fill="#333333">Read and replay ciphertext only</text>
  <text x="698" y="342" font-size="11.5" fill="#333333">Lost: nothing, if GCM, sequence</text>
  <text x="698" y="358" font-size="11.5" fill="#333333">and timestamp are used correctly</text>
  <text x="698" y="378" font-size="11.5" font-weight="600" fill="#1e6b38">resists V5, V6</text>
  <line x1="790" y1="278" x2="752" y2="180" stroke="#1e6b38" stroke-width="1.8" marker-end="url(#greenarrow)"/>

  <!-- P4 -->
  <rect x="440" y="412" width="226" height="86" rx="6" fill="#fdf0ef" stroke="#b3261e" stroke-width="1.8"/>
  <text x="454" y="434" font-size="13" font-weight="700" fill="#b3261e">P4 — Configuration</text>
  <text x="454" y="454" font-size="11.5" fill="#333333">Enable passthrough or fallback</text>
  <text x="454" y="472" font-size="11.5" fill="#333333">Lost: drops to the legacy level</text>
  <text x="454" y="490" font-size="11.5" font-weight="600" fill="#b3261e">V7</text>
  <polyline points="440,450 431,450 431,232 490,232 490,224" fill="none" stroke="#b3261e" stroke-width="1.8" marker-end="url(#redarrow)"/>

  <!-- Key finding -->
  <rect x="24" y="412" width="394" height="86" rx="6" fill="#f5f5f5" stroke="#888888" stroke-width="1.3"/>
  <text x="38" y="434" font-size="12.5" font-weight="700" fill="#111111">Central finding (V2)</text>
  <text x="38" y="454" font-size="11.5" fill="#333333">The gateway authenticates the channel. It cannot</text>
  <text x="38" y="471" font-size="11.5" fill="#333333">authenticate the measurement. A frame forged at P1</text>
  <text x="38" y="488" font-size="11.5" fill="#333333">arrives under a valid AES tag and is believed.</text>

  <text x="24" y="534" font-size="11" fill="#777777">Out of scope: AES side-channel and fault attacks, control-centre compromise, gateway firmware supply chain, physical destruction, stolen-credential remote access.</text>
</svg>
